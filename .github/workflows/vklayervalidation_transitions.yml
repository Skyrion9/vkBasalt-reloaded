name: Validation Layer Transition Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  validation-transitions:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 30
    steps:
      - name: Bootstrap git
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm
          pacman -S --noconfirm git ca-certificates

      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm
          pacman -S --noconfirm git meson ninja \
            vulkan-headers vulkan-icd-loader vulkan-tools vulkan-validation-layers \
            mesa vulkan-swrast llvm lld clang \
            libx11 libxrandr libxi libxcb wayland wayland-protocols libxkbcommon \
            zstd glslang spirv-tools spirv-headers \
            xorg-server-xvfb

      - name: Build layer
        run: |
          export CC=clang
          export CXX=clang++
          export CC_LD=lld
          export CXX_LD=lld
          meson setup builddir \
            --buildtype=release \
            -Db_lto=true \
            -Db_lto_mode=thin \
            -Doptimization=2
          meson compile -C builddir
          echo "=== Verifying build ==="
          ls -la builddir/src/libVkLayer_Basalt_reloaded.so
          llvm-nm -D builddir/src/libVkLayer_Basalt_reloaded.so | grep -c "vkBasalt_GetInstanceProcAddr" || exit 1

      - name: Setup Vulkan and Layer
        run: |
          mkdir -p ~/.local/share/vulkan/implicit_layer.d
          cat > ~/.local/share/vulkan/implicit_layer.d/vkBasalt.json << MANIFEST
          {
              "file_format_version": "1.0.0",
              "layer": {
                  "name": "VK_LAYER_VKBASALT_RELOADED_post_processing",
                  "type": "INSTANCE",
                  "library_path": "$(pwd)/builddir/src/libVkLayer_Basalt_reloaded.so",
                  "api_version": "1.3.223",
                  "implementation_version": "1",
                  "description": "vkBasalt Reloaded post processing layer",
                  "functions": {
                      "vkGetInstanceProcAddr": "vkBasalt_GetInstanceProcAddr",
                      "vkGetDeviceProcAddr": "vkBasalt_GetDeviceProcAddr"
                  },
                  "enable_environment": {
                      "ENABLE_VKBASALT_RELOADED": "1"
                  },
                  "disable_environment": {
                      "DISABLE_VKBASALT_RELOADED": "1"
                  }
              }
          }
          MANIFEST

      - name: Run validation transition tests
        env:
          ENABLE_VKBASALT_RELOADED: "1"
          VKBASALT_FORCE_HDR_PGO: "1"
          VK_ICD_FILENAMES: "/usr/share/vulkan/icd.d/lvp_icd.json"
        run: |
          chmod +x test_runtime_transitions.sh
          ./test_runtime_transitions.sh

      - name: Prepare logs for upload
        if: always()
        run: |
          mkdir -p "$GITHUB_WORKSPACE/validation_logs"
          for f in /tmp/validation_stages.log /tmp/validation_errors.log \
                   /tmp/vkcube_stderr.log /tmp/vkcube_stdout.log \
                   /tmp/vk_layer_settings.txt; do
            [ -f "$f" ] && cp "$f" "$GITHUB_WORKSPACE/validation_logs/" || true
          done
          ls -la "$GITHUB_WORKSPACE/validation_logs"

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-transition-logs
          path: validation_logs/
          retention-days: 7
